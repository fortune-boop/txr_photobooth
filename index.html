<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0e06">
<title>Texas Roadhouse Christmas Photo Booth</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1a0e06;font-family:Georgia,serif;overflow:hidden;touch-action:manipulation}
#app{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a0e06}

#landing{width:100%;height:100vh;background:#1a0e06;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:2rem}
.land-logo{font-size:11px;letter-spacing:4px;color:#C8960C;text-transform:uppercase}
.land-title{font-size:30px;color:#FFD700;text-align:center;line-height:1.4}
.land-sub{font-size:12px;color:#FFB347;letter-spacing:2px}
.land-btn{background:#8B2020;color:#FFD700;border:2px solid #C8960C;padding:16px 40px;font-size:15px;font-family:Georgia,serif;letter-spacing:2px;cursor:pointer;border-radius:4px;margin-top:8px}
.land-divider{width:100px;height:1px;background:#C8960C;opacity:0.4}
.land-hint{font-size:11px;color:rgba(200,150,12,0.5);letter-spacing:1px}

#booth{width:100%;height:100vh;display:none;flex-direction:column;align-items:center;background:#1a0e06}

/* 카메라 래퍼: 9:16 고정 */
.cam-wrap{
  position:relative;
  width:100%;
  max-width:420px;
  flex:1;
  overflow:hidden;
  background:#000;
}
/* video: 전면은 mirror, 후면은 정방향. object-fit:cover 제거하고 contain으로 작게 */
#video{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  object-fit:contain;
  background:#000;
}
#canvas{display:none}

.frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* 스티커 레이어 */
.sticker-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.sticker-item{position:absolute;font-size:36px;pointer-events:auto;cursor:move;user-select:none;touch-action:none;line-height:1}

.msg-area{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);width:66%;z-index:10}
#msgInput{width:100%;background:rgba(0,0,0,0.45);border:1px dashed rgba(255,215,0,0.6);border-radius:6px;padding:8px 12px;font-size:13px;color:#FFD700;text-align:center;font-family:Georgia,serif;outline:none;-webkit-appearance:none}
#msgInput::placeholder{color:rgba(255,215,0,0.4)}

.snowflakes{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.sf{position:absolute;color:rgba(255,255,255,0.7);animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:.9}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}

/* 스티커 선택 바 */
.sticker-bar{width:100%;max-width:420px;background:#0e0804;padding:8px 12px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;border-bottom:1px solid rgba(200,150,12,0.2)}
.sticker-bar::-webkit-scrollbar{display:none}
.sticker-opt{font-size:26px;cursor:pointer;padding:4px 6px;border-radius:6px;border:1px solid transparent;flex-shrink:0}
.sticker-opt:hover{background:rgba(200,150,12,0.15);border-color:rgba(200,150,12,0.4)}
.sticker-bar-label{font-size:10px;color:rgba(200,150,12,0.5);letter-spacing:1px;align-self:center;flex-shrink:0;padding-left:2px}

.ctrl-bar{width:100%;max-width:420px;background:#120a04;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.ctrl-btn{background:transparent;border:1px solid rgba(200,150,12,0.5);color:#C8960C;padding:9px 14px;font-size:12px;font-family:Georgia,serif;cursor:pointer;border-radius:4px;letter-spacing:1px}
.ctrl-btn:hover{background:rgba(200,150,12,0.15)}
.shutter-btn{width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.35);cursor:pointer;flex-shrink:0;transition:transform .1s}
.shutter-btn:active{transform:scale(0.9)}

#result-view{display:none;width:100%;height:100vh;flex-direction:column;align-items:center;background:#1a0e06}
#result-img{flex:1;width:100%;max-width:420px;object-fit:contain;display:block}
.result-actions{width:100%;max-width:420px;background:#120a04;padding:14px 16px;display:flex;gap:8px;flex-shrink:0}
.act-btn{flex:1;padding:13px 6px;font-size:13px;font-family:Georgia,serif;letter-spacing:1px;cursor:pointer;border-radius:4px;text-align:center;border:none}
.act-dl{background:#8B2020;color:#FFD700;border:1px solid #C8960C}
.act-ig{background:#C8960C;color:#1a0e06;font-weight:bold}
.act-re{background:transparent;color:#C8960C;border:1px solid rgba(200,150,12,0.4)}
.result-tag{font-size:11px;color:rgba(255,179,71,0.45);letter-spacing:1px;padding:8px;font-family:Georgia,serif;flex-shrink:0;text-align:center}

/* 인스타 안내 모달 */
#igModal{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.8);z-index:100;align-items:center;justify-content:center;padding:2rem}
.ig-box{background:#1a0e06;border:2px solid #C8960C;border-radius:12px;padding:1.5rem;width:100%;max-width:320px;text-align:center}
.ig-title{font-size:16px;color:#FFD700;margin-bottom:12px;letter-spacing:1px}
.ig-step{font-size:13px;color:#FFB347;line-height:2;text-align:left;padding:0 0.5rem}
.ig-close{margin-top:16px;background:#8B2020;color:#FFD700;border:1px solid #C8960C;padding:10px 28px;font-size:13px;font-family:Georgia,serif;cursor:pointer;border-radius:4px;letter-spacing:1px}

.no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0705;color:#C8960C;font-size:13px;gap:12px;text-align:center;padding:2rem;z-index:20}
.no-cam-hint{font-size:11px;opacity:0.6;margin-top:4px;line-height:1.7}
</style>
</head>

<script>
let stream = null;
let facing = 'user';
let dragTarget = null, dragOffX = 0, dragOffY = 0;

function makeSnow(){
  const c = document.getElementById('snowflakes');
  c.innerHTML = '';
  for(let i=0;i<18;i++){
    const s = document.createElement('div');
    s.className = 'sf';
    s.textContent = ['*','·','✦','❄'][Math.floor(Math.random()*4)];
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (4+Math.random()*6)+'s';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.fontSize = (8+Math.random()*10)+'px';
    c.appendChild(s);
  }
}

async function startBooth(){
  document.getElementById('landing').style.display='none';
  document.getElementById('booth').style.display='flex';
  makeSnow();
  await startCamera();
}

async function startCamera(){
  try{
    if(stream){stream.getTracks().forEach(t=>t.stop());}
    const constraints = {
      video:{
        facingMode: facing,
        width:{ideal:720},
        height:{ideal:1280}
      },
      audio:false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    const v = document.getElementById('video');
    v.srcObject = stream;
    // 전면: 좌우 반전(셀카 미러), 후면: 정방향
    v.style.transform = facing==='user' ? 'scaleX(-1)' : 'scaleX(1)';
    document.getElementById('noCam').style.display='none';
    v.style.display='block';
  }catch(e){
    document.getElementById('noCam').style.display='flex';
    document.getElementById('video').style.display='none';
  }
}

async function flipCamera(){
  facing = facing==='user'?'environment':'user';
  await startCamera();
}

document.getElementById('msgInput').addEventListener('input',function(){
  const t = document.getElementById('msgDisplay');
  if(t) t.textContent = this.value;
});

// 스티커 추가
function addSticker(emoji){
  const layer = document.getElementById('stickerLayer');
  const wrap = document.getElementById('camWrap');
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;
  const el = document.createElement('div');
  el.className = 'sticker-item';
  el.textContent = emoji;
  el.style.left = (w/2 - 20 + Math.random()*40 - 20)+'px';
  el.style.top  = (h/2 - 20 + Math.random()*40 - 20)+'px';

  // 터치 드래그
  el.addEventListener('touchstart', e=>{
    e.preventDefault();
    dragTarget = el;
    const rect = el.getBoundingClientRect();
    const wRect = wrap.getBoundingClientRect();
    dragOffX = e.touches[0].clientX - rect.left;
    dragOffY = e.touches[0].clientY - rect.top;
  },{passive:false});

  // 마우스 드래그
  el.addEventListener('mousedown', e=>{
    dragTarget = el;
    const rect = el.getBoundingClientRect();
    dragOffX = e.clientX - rect.left;
    dragOffY = e.clientY - rect.top;
  });

  // 더블탭/클릭으로 삭제
  let lastTap = 0;
  el.addEventListener('touchend', e=>{
    const now = Date.now();
    if(now-lastTap < 300){ el.remove(); }
    lastTap = now;
    dragTarget = null;
  });
  el.addEventListener('dblclick', ()=> el.remove());

  layer.appendChild(el);
}

function clearStickers(){
  document.getElementById('stickerLayer').innerHTML='';
}

// 드래그 이동
document.addEventListener('touchmove', e=>{
  if(!dragTarget) return;
  e.preventDefault();
  const wrap = document.getElementById('camWrap');
  const wRect = wrap.getBoundingClientRect();
  let x = e.touches[0].clientX - wRect.left - dragOffX;
  let y = e.touches[0].clientY - wRect.top  - dragOffY;
  dragTarget.style.left = Math.max(0, Math.min(wRect.width-40, x))+'px';
  dragTarget.style.top  = Math.max(0, Math.min(wRect.height-40, y))+'px';
},{passive:false});

document.addEventListener('mousemove', e=>{
  if(!dragTarget) return;
  const wrap = document.getElementById('camWrap');
  const wRect = wrap.getBoundingClientRect();
  let x = e.clientX - wRect.left - dragOffX;
  let y = e.clientY - wRect.top  - dragOffY;
  dragTarget.style.left = Math.max(0, Math.min(wRect.width-40, x))+'px';
  dragTarget.style.top  = Math.max(0, Math.min(wRect.height-40, y))+'px';
});

document.addEventListener('mouseup', ()=> dragTarget=null);
document.addEventListener('touchend', ()=> dragTarget=null);

// 촬영: 9:16 비율 강제 유지
function takePhoto(){
  const v = document.getElementById('video');
  const wrap = document.getElementById('camWrap');
  const W = wrap.offsetWidth;
  const H = wrap.offsetHeight;

  const cv = document.getElementById('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');

  // 비디오 그리기 (전면: 좌우반전 원복, 후면: 그대로)
  const vw = v.videoWidth || W;
  const vh = v.videoHeight || H;
  const scale = Math.max(W/vw, H/vh);
  const dw = vw * scale;
  const dh = vh * scale;
  const dx = (W - dw)/2;
  const dy = (H - dh)/2;

  ctx.save();
  if(facing === 'user'){
    // 전면: 화면은 mirror였으므로 캔버스엔 정방향으로
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(v, dx, dy, dw, dh);
  ctx.restore();

  // 스티커 그리기
  const layer = document.getElementById('stickerLayer');
  const stickers = layer.querySelectorAll('.sticker-item');
  stickers.forEach(s=>{
    const x = parseFloat(s.style.left);
    const y = parseFloat(s.style.top);
    ctx.font = '36px serif';
    ctx.fillText(s.textContent, x, y+32);
  });

  // SVG 프레임 그리기
  const svgEl = wrap.querySelector('.frame-svg');
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  const blob = new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = function(){
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    finishPhoto(cv.toDataURL('image/jpeg', 0.93));
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    finishPhoto(cv.toDataURL('image/jpeg', 0.93));
  };
  img.src = url;
}

function finishPhoto(dataUrl){
  document.getElementById('result-img').src = dataUrl;
  document.getElementById('booth').style.display='none';
  document.getElementById('result-view').style.display='flex';
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
}

let savedDataUrl = '';

function downloadPhoto(){
  savedDataUrl = document.getElementById('result-img').src;
  const a = document.createElement('a');
  a.download = 'TxRH-Christmas-'+Date.now()+'.jpg';
  a.href = savedDataUrl;
  a.click();
}

function openInstagram(){
  // 먼저 사진 저장
  downloadPhoto();
  // 인스타 앱 딥링크 시도
  setTimeout(()=>{
    window.location.href = 'instagram://camera';
    // 앱이 없으면 안내 모달
    setTimeout(()=>{
      document.getElementById('igModal').style.display='flex';
    }, 1200);
  }, 600);
}

function downloadAndClose(){
  closeIgModal();
}

function closeIgModal(){
  document.getElementById('igModal').style.display='none';
}

function retake(){
  document.getElementById('result-view').style.display='none';
  document.getElementById('booth').style.display='flex';
  document.getElementById('msgInput').value='';
  document.getElementById('msgDisplay').textContent='';
  clearStickers();
  makeSnow();
  startCamera();
}

function resetBooth(){
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  document.getElementById('booth').style.display='none';
  document.getElementById('result-view').style.display='none';
  document.getElementById('igModal').style.display='none';
  document.getElementById('landing').style.display='flex';
}
</script>
