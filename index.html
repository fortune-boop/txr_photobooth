<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0a00">
<title>Texas Roadhouse Photo Booth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap');
:root{--red:#c0392b;--gold:#e8a020;--cream:#fff8ee;--dark:#1a0a00;--green:#2d7a2d;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--dark);overflow:hidden;touch-action:manipulation}
.btn{font-family:'Press Start 2P',monospace;cursor:pointer;border:none;outline:none;transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn-red{background:var(--red);color:#fff;border-bottom:4px solid #8b1a1a;padding:10px 18px;font-size:9px;letter-spacing:1px}
.btn-gold{background:var(--gold);color:var(--dark);border-bottom:4px solid #b06010;padding:10px 18px;font-size:9px;letter-spacing:1px}
.btn-sm{padding:7px 13px;font-size:7px}
/* LANDING */
#scLanding{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--dark);gap:0;z-index:10;overflow:hidden}
.land-logo{font-family:'Press Start 2P',monospace;color:var(--gold);font-size:clamp(14px,4vw,22px);text-align:center;line-height:1.5;text-shadow:4px 4px 0 var(--red);margin-bottom:4px}
.land-sub{font-family:'Press Start 2P',monospace;color:var(--red);font-size:7px;letter-spacing:2px;margin-bottom:20px}
.land-top{font-family:'Press Start 2P',monospace;color:var(--gold);font-size:8px;letter-spacing:2px;margin-bottom:8px;opacity:.7}
.mode-row{display:flex;gap:10px;margin-bottom:14px}
.mode-btn{font-family:'Press Start 2P',monospace;font-size:8px;color:rgba(255,248,238,.45);background:transparent;border:2px solid rgba(232,160,32,.3);padding:8px 16px;cursor:pointer;transition:all .15s}
.mode-btn.active,.mode-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(232,160,32,.1)}
.choose-grid{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.choose-card{width:138px;background:rgba(255,248,238,.05);border:2px solid rgba(232,160,32,.4);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:background .15s,transform .1s;position:relative}
.choose-card:hover,.choose-card.active{background:rgba(232,160,32,.14);border-color:var(--gold);transform:translateY(-2px)}
.choose-card .cc-icon{font-size:28px}
.choose-card .cc-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);text-align:center;line-height:1.6}
.choose-card .cc-sub{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:rgba(255,255,255,.45);text-align:center}
.choose-card .cc-badge{position:absolute;top:-8px;right:-8px;background:var(--red);font-family:'Press Start 2P',monospace;font-size:6px;color:#fff;padding:3px 5px}
/* BOOTH */
#scBooth{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;background:var(--dark);z-index:10}
.booth-topbar{width:100%;max-width:480px;background:#110600;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid rgba(232,160,32,.18)}
.bt-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold)}
.shot-indicator{display:flex;gap:6px}
.shot-dot{width:10px;height:10px;background:rgba(255,255,255,.12);border:1px solid rgba(232,160,32,.3)}
.shot-dot.done{background:var(--gold)}
.shot-dot.cur{background:var(--red);animation:blink .6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cam-wrap{position:relative;width:100%;max-width:480px;aspect-ratio:9/16;max-height:calc(100vh - 178px);overflow:hidden;background:#000;flex-shrink:0;margin:0 auto}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#000}
#canvas{display:none}
.frame-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.sticker-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.sticker-item{position:absolute;pointer-events:auto;cursor:move;user-select:none;touch-action:none}
.snowflakes{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.sf{position:absolute;color:rgba(255,255,255,.6);animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:.9}100%{transform:translateY(105%);opacity:0}}
.no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0500;color:var(--gold);font-size:12px;gap:10px;text-align:center;padding:2rem;z-index:20}
.zoom-bar{width:100%;max-width:480px;background:#110600;padding:5px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-top:1px solid rgba(232,160,32,.1)}
.zoom-bar input{flex:1;accent-color:var(--gold);height:3px;cursor:pointer}
.zoom-bar span{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);width:32px;text-align:right}
.tool-bar{width:100%;max-width:480px;background:#0e0500;padding:6px 10px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;border-top:1px solid rgba(232,160,32,.1);align-items:center}
.tool-bar::-webkit-scrollbar{display:none}
.tool-opt{font-size:22px;cursor:pointer;padding:4px 5px;border:1px solid transparent;flex-shrink:0;line-height:1}
.tool-opt:hover{background:rgba(232,160,32,.15);border-color:rgba(232,160,32,.4)}
.tool-sep{width:1px;height:20px;background:rgba(232,160,32,.2);flex-shrink:0;margin:0 2px}
.tool-label{font-family:'Press Start 2P',monospace;font-size:6px;color:rgba(232,160,32,.45);flex-shrink:0;white-space:nowrap}
.tool-tbtn{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--gold);background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.35);padding:5px 8px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.ctrl-bar{width:100%;max-width:480px;background:#110600;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.ctrl-btn{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);background:transparent;border:2px solid rgba(232,160,32,.35);padding:8px 12px;cursor:pointer}
.ctrl-btn:hover{background:rgba(232,160,32,.1)}
.shutter-btn{width:56px;height:56px;border-radius:50%;background:var(--cream);border:4px solid rgba(255,255,255,.3);cursor:pointer;flex-shrink:0;box-shadow:0 0 0 2px var(--gold);transition:transform .1s}
.shutter-btn:active{transform:scale(.9)}
/* RESULT */
#scResult{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;background:var(--dark);z-index:10}
#resultImg{width:100%;max-width:480px;flex:1;object-fit:contain;display:block}
.result-bar{width:100%;max-width:480px;background:#110600;padding:12px;display:flex;gap:8px;flex-shrink:0}
.result-tag{font-family:'Press Start 2P',monospace;font-size:7px;color:rgba(232,160,32,.38);text-align:center;padding:7px;flex-shrink:0}
/* MODALS */
#bubbleModal,#igModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;align-items:center;justify-content:center;padding:2rem}
.modal-box{background:#1a0a00;border:2px solid var(--gold);padding:1.25rem;width:100%;max-width:300px}
.modal-box .mb-title{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);margin-bottom:12px}
.modal-box input{width:100%;background:rgba(255,248,238,.07);border:1px solid rgba(232,160,32,.35);color:var(--cream);padding:8px 10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;outline:none;margin-bottom:10px}
.mb-row{display:flex;gap:8px}
.ig-step{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:rgba(255,220,150,.8);line-height:2.1}
.ig-step b{color:var(--gold)}
</style>
</head>
<body>

<!-- LANDING -->
<div id="scLanding">
  <div class="land-top">★ PHOTO BOOTH ★</div>
  <div class="land-logo">TEXAS<br>ROADHOUSE</div>
  <div class="land-sub">CHRISTMAS 2024</div>
  <div class="mode-row">
    <button class="mode-btn active" id="btn1cut" onclick="setMode(1)">1컷</button>
    <button class="mode-btn" id="btn4cut" onclick="setMode(4)">4컷</button>
  </div>
  <div class="choose-grid">
    <div class="choose-card active" id="card0" onclick="setFrame(0)">
      <div class="cc-badge">NEW</div>
      <div class="cc-icon">🍞🥜🥩🥔</div>
      <div class="cc-title">APPETIZER</div>
      <div class="cc-sub">에피타이저 4컷</div>
    </div>
    <div class="choose-card" id="card1" onclick="setFrame(1)">
      <div class="cc-icon">🤠🎄⭐❄️</div>
      <div class="cc-title">TX XMAS</div>
      <div class="cc-sub">텍사스 크리스마스</div>
    </div>
  </div>
  <button class="btn btn-red" onclick="startBooth()">START ▶</button>
  <div style="font-family:'Press Start 2P',monospace;font-size:6px;color:rgba(232,160,32,.3);margin-top:10px">카메라 권한이 필요합니다</div>
</div>

<!-- BOOTH -->
<div id="scBooth">
  <div class="booth-topbar">
    <span class="bt-title" id="boothTitle">APPETIZER</span>
    <div class="shot-indicator" id="shotIndicator"></div>
  </div>
  <div class="cam-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="snowflakes" id="snowflakes"></div>
    <div class="sticker-layer" id="stickerLayer"></div>
    <svg id="frameSvg" class="frame-layer" viewBox="0 0 360 640" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="no-cam" id="noCam" style="display:none">
      <div style="font-size:32px">📷</div>
      <div style="font-family:'Press Start 2P',monospace;font-size:9px">카메라 없음</div>
      <div style="font-family:'Noto Sans KR',sans-serif;font-size:11px;opacity:.55;margin-top:6px">브라우저 권한을 허용해주세요</div>
    </div>
  </div>
  <div class="zoom-bar">
    <span style="font-size:11px">🔍</span>
    <input id="zoomSlider" type="range" min="0.5" max="4" step="0.1" value="1" oninput="applyZoom(parseFloat(this.value))">
    <span id="zoomLabel">1.0x</span>
  </div>
  <div class="tool-bar">
    <span class="tool-label">스티커</span>
    <span class="tool-opt" onclick="addSticker('🤠')">🤠</span>
    <span class="tool-opt" onclick="addSticker('🎄')">🎄</span>
    <span class="tool-opt" onclick="addSticker('⭐')">⭐</span>
    <span class="tool-opt" onclick="addSticker('❄️')">❄️</span>
    <span class="tool-opt" onclick="addSticker('🎅')">🎅</span>
    <span class="tool-opt" onclick="addSticker('🥩')">🥩</span>
    <span class="tool-opt" onclick="addSticker('🍞')">🍞</span>
    <span class="tool-opt" onclick="addSticker('🥔')">🥔</span>
    <span class="tool-opt" onclick="addSticker('🥜')">🥜</span>
    <div class="tool-sep"></div>
    <span class="tool-label">문구</span>
    <button class="tool-tbtn" onclick="showBubbleModal()">💬 말풍선</button>
    <div class="tool-sep"></div>
    <button class="tool-tbtn" onclick="clearAll()" style="color:rgba(255,100,100,.65)">🗑</button>
  </div>
  <div class="ctrl-bar">
    <button class="ctrl-btn" onclick="flipCamera()">🔄</button>
    <button class="shutter-btn" onclick="takeShot()"></button>
    <button class="ctrl-btn" onclick="goLanding()">✕</button>
  </div>
</div>

<!-- RESULT -->
<div id="scResult">
  <img id="resultImg" alt="">
  <div class="result-bar">
    <button class="btn btn-red btn-sm" style="flex:1" onclick="downloadPhoto()">💾 저장</button>
    <button class="btn btn-gold btn-sm" style="flex:1" onclick="openInstagram()">📸 인스타</button>
    <button class="btn btn-sm" style="flex:1;background:transparent;color:var(--gold);border:2px solid rgba(232,160,32,.35);font-family:'Press Start 2P',monospace;font-size:7px" onclick="retake()">↩ 다시</button>
  </div>
  <div class="result-tag">#TxRH크리스마스 #텍사스로드하우스</div>
</div>

<!-- 말풍선 모달 -->
<div id="bubbleModal">
  <div class="modal-box">
    <div class="mb-title">💬 말풍선 추가</div>
    <input id="bubbleInput" type="text" maxlength="20" placeholder="텍스트 입력 (최대 20자)">
    <div class="mb-row">
      <button class="btn btn-gold btn-sm" style="flex:1" onclick="addBubble()">추가</button>
      <button class="btn btn-sm" style="flex:1;background:transparent;color:var(--gold);border:2px solid rgba(232,160,32,.35);font-family:'Press Start 2P',monospace;font-size:7px" onclick="closeBubbleModal()">취소</button>
    </div>
  </div>
</div>

<!-- 인스타 모달 -->
<div id="igModal">
  <div class="modal-box">
    <div class="mb-title">📸 INSTAGRAM</div>
    <div class="ig-step">1. <b>저장하기</b>로 사진 저장<br>2. 인스타그램 앱 열기<br>3. 스토리/피드에 업로드<br>4. <b>#TxRH크리스마스</b> 태그</div>
    <div class="mb-row" style="margin-top:12px">
      <button class="btn btn-red btn-sm" style="flex:1" onclick="downloadPhoto();closeIgModal()">💾 저장</button>
      <button class="btn btn-sm" style="flex:1;background:transparent;color:var(--gold);border:2px solid rgba(232,160,32,.35);font-family:'Press Start 2P',monospace;font-size:7px" onclick="closeIgModal()">닫기</button>
    </div>
  </div>
</div>

// ── 상태 ──
let stream=null, facing='user';
let currentZoom=1, pinchStartDist=0, pinchStartZoom=1;
let selectedMode=1, selectedFrame=0;
let shotCount=0, shots=[], totalShots=1;
let dragTarget=null, dragOffX=0, dragOffY=0;

function setMode(m){
  selectedMode=m;
  document.getElementById('btn1cut').classList.toggle('active',m===1);
  document.getElementById('btn4cut').classList.toggle('active',m===4);
}
function setFrame(f){
  selectedFrame=f;
  [0,1].forEach(i=>document.getElementById('card'+i).classList.toggle('active',i===f));
}

async function startBooth(){
  totalShots=selectedMode===4?4:1;
  shotCount=0; shots=[];
  document.getElementById('boothTitle').textContent=FRAMES[selectedFrame].title;
  updateIndicator();
  updateFrame();
  document.getElementById('scLanding').style.display='none';
  document.getElementById('scBooth').style.display='flex';
  makeSnow();
  await startCamera();
}
function updateIndicator(){
  const el=document.getElementById('shotIndicator');
  if(totalShots===1){el.innerHTML='';return;}
  el.innerHTML=Array.from({length:totalShots},(_,i)=>{
    let c='shot-dot';
    if(i<shotCount)c+=' done';
    else if(i===shotCount)c+=' cur';
    return '<div class="'+c+'"></div>';
  }).join('');
}
function updateFrame(){
  const idx=totalShots===4?shotCount:0;
  const si=Math.min(idx,FRAMES[selectedFrame].svgs.length-1);
  document.getElementById('frameSvg').innerHTML=FRAMES[selectedFrame].svgs[si];
}
function applyZoom(z){
  currentZoom=Math.max(0.5,Math.min(4,z));
  const v=document.getElementById('video');
  v.style.transform=(facing==='user'?'scaleX(-1)':'scaleX(1)')+' scale('+currentZoom+')';
  const sl=document.getElementById('zoomSlider');if(sl)sl.value=currentZoom;
  const lb=document.getElementById('zoomLabel');if(lb)lb.textContent=currentZoom.toFixed(1)+'x';
}
async function startCamera(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:false});
    const v=document.getElementById('video');
    v.srcObject=stream;
    applyZoom(1);
    document.getElementById('noCam').style.display='none';
    v.style.display='block';
  }catch(e){
    document.getElementById('noCam').style.display='flex';
    document.getElementById('video').style.display='none';
  }
}
async function flipCamera(){facing=facing==='user'?'environment':'user';await startCamera();}

const camW=document.getElementById('camWrap');
camW.addEventListener('touchstart',e=>{
  if(e.touches.length===2&&!dragTarget){
    pinchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchStartZoom=currentZoom;
  }
},{passive:true});
camW.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&!dragTarget){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    applyZoom(pinchStartZoom*(d/pinchStartDist));
  }
},{passive:false});

function addSticker(emoji){
  const layer=document.getElementById('stickerLayer');
  const wrap=document.getElementById('camWrap');
  const el=document.createElement('div');
  el.className='sticker-item';
  el.innerHTML='<span style="font-size:34px;line-height:1">'+emoji+'</span>';
  el.style.left=(wrap.offsetWidth/2-17+Math.random()*30-15)+'px';
  el.style.top=(wrap.offsetHeight/2-17+Math.random()*30-15)+'px';
  attachDrag(el);
  layer.appendChild(el);
}
function showBubbleModal(){
  document.getElementById('bubbleModal').style.display='flex';
  setTimeout(()=>document.getElementById('bubbleInput').focus(),80);
}
function closeBubbleModal(){
  document.getElementById('bubbleModal').style.display='none';
  document.getElementById('bubbleInput').value='';
}
function addBubble(){
  const txt=document.getElementById('bubbleInput').value.trim();
  if(!txt)return;
  const layer=document.getElementById('stickerLayer');
  const wrap=document.getElementById('camWrap');
  const el=document.createElement('div');
  el.className='sticker-item';
  el.style.left=(wrap.offsetWidth/2-60)+'px';
  el.style.top=(wrap.offsetHeight/2-24)+'px';
  el.innerHTML='<div style="position:relative;background:rgba(255,248,238,0.93);border:2.5px solid #c0392b;border-radius:8px;padding:6px 11px;max-width:150px;font-family:\'Noto Sans KR\',sans-serif;font-size:13px;color:#1a0a00;font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 #8b1a1a">'+txt+'<div style="position:absolute;bottom:-11px;left:16px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #c0392b"></div></div>';
  attachDrag(el);
  layer.appendChild(el);
  closeBubbleModal();
}
function attachDrag(el){
  const wrap=document.getElementById('camWrap');
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    e.preventDefault();
    dragTarget=el;
    const r=el.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
    dragOffX=e.touches[0].clientX-r.left;dragOffY=e.touches[0].clientY-r.top;
  },{passive:false});
  el.addEventListener('mousedown',e=>{
    dragTarget=el;
    const r=el.getBoundingClientRect();dragOffX=e.clientX-r.left;dragOffY=e.clientY-r.top;
  });
  let lastTap=0;
  el.addEventListener('touchend',e=>{
    const now=Date.now();if(now-lastTap<300)el.remove();lastTap=now;dragTarget=null;
  });
  el.addEventListener('dblclick',()=>el.remove());
}
document.addEventListener('touchmove',e=>{
  if(!dragTarget)return;
  e.preventDefault();
  const wrap=document.getElementById('camWrap');
  const wr=wrap.getBoundingClientRect();
  dragTarget.style.left=Math.max(0,Math.min(wr.width-40,e.touches[0].clientX-wr.left-dragOffX))+'px';
  dragTarget.style.top=Math.max(0,Math.min(wr.height-40,e.touches[0].clientY-wr.top-dragOffY))+'px';
},{passive:false});
document.addEventListener('mousemove',e=>{
  if(!dragTarget)return;
  const wrap=document.getElementById('camWrap');
  const wr=wrap.getBoundingClientRect();
  dragTarget.style.left=Math.max(0,Math.min(wr.width-40,e.clientX-wr.left-dragOffX))+'px';
  dragTarget.style.top=Math.max(0,Math.min(wr.height-40,e.clientY-wr.top-dragOffY))+'px';
});
document.addEventListener('mouseup',()=>dragTarget=null);
document.addEventListener('touchend',()=>dragTarget=null);
function clearAll(){document.getElementById('stickerLayer').innerHTML='';}

function takeShot(){
  const v=document.getElementById('video');
  const wrap=document.getElementById('camWrap');
  const CW=1080,CH=1920;
  const dW=wrap.offsetWidth,dH=wrap.offsetHeight;
  const cv=document.getElementById('canvas');
  cv.width=CW;cv.height=CH;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=FRAMES[selectedFrame].bg||'#1a0a00';
  ctx.fillRect(0,0,CW,CH);
  const vw=v.videoWidth||CW,vh=v.videoHeight||CH;
  const sc=Math.max(CW/vw,CH/vh)*currentZoom;
  const dw=vw*sc,dh=vh*sc,dx=(CW-dw)/2,dy=(CH-dh)/2;
  ctx.save();
  if(facing==='user'){ctx.translate(CW,0);ctx.scale(-1,1);}
  ctx.drawImage(v,dx,dy,dw,dh);
  ctx.restore();
  const stickers=document.getElementById('stickerLayer').querySelectorAll('.sticker-item');
  stickers.forEach(s=>{
    const sx=parseFloat(s.style.left)*(CW/dW);
    const sy=parseFloat(s.style.top)*(CH/dH);
    const span=s.querySelector('span');
    if(span){
      ctx.font=(34*(CW/dW))+'px serif';
      ctx.fillText(span.textContent,sx,sy+34*(CH/dH));
    } else {
      const inner=s.querySelector('div');
      if(inner){
        const txt=inner.childNodes[0].nodeValue||inner.textContent.split('\n')[0].trim();
        const fs=14*(CW/dW);
        ctx.font='bold '+fs+'px sans-serif';
        const tw=ctx.measureText(txt).width;
        const bx=sx,by=sy,bw=tw+24*(CW/dW),bh=30*(CH/dH);
        ctx.fillStyle='rgba(255,248,238,0.93)';ctx.fillRect(bx,by,bw,bh);
        ctx.strokeStyle='#c0392b';ctx.lineWidth=2.5*(CW/dW);ctx.strokeRect(bx,by,bw,bh);
        ctx.fillStyle='#1a0a00';ctx.fillText(txt,bx+12*(CW/dW),by+fs+5*(CH/dH));
        ctx.fillStyle='rgba(255,248,238,0.93)';
        ctx.beginPath();ctx.moveTo(bx+16*(CW/dW),by+bh);ctx.lineTo(bx+8*(CW/dW),by+bh+11*(CH/dH));ctx.lineTo(bx+32*(CW/dW),by+bh);ctx.fillStyle='#c0392b';ctx.fill();
      }
    }
  });
  const svgEl=document.getElementById('frameSvg');
  const svgData=new XMLSerializer().serializeToString(svgEl);
  const blob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  function finish(){
    URL.revokeObjectURL(url);
    const dataUrl=cv.toDataURL('image/jpeg',.93);
    shots.push(dataUrl);shotCount++;
    if(totalShots===4&&shotCount<4){
      clearAll();updateIndicator();updateFrame();flash();
    } else {
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      if(totalShots===4)buildFour();else showResult(dataUrl);
    }
  }
  img.onload=function(){ctx.drawImage(img,0,0,CW,CH);finish();};
  img.onerror=finish;
  img.src=url;
}
function flash(){
  const wrap=document.getElementById('camWrap');
  const fl=document.createElement('div');
  fl.style.cssText='position:absolute;inset:0;background:white;z-index:20;opacity:.8;pointer-events:none;transition:opacity .2s';
  wrap.appendChild(fl);setTimeout(()=>{fl.style.opacity='0';setTimeout(()=>fl.remove(),200);},50);
}
function buildFour(){
  const CW=1080,CH=1920,GAP=16;
  const cv=document.getElementById('canvas');
  cv.width=CW*2+GAP*3;cv.height=CH*2+GAP*3;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#1a0a00';ctx.fillRect(0,0,cv.width,cv.height);
  const pos=[[GAP,GAP],[CW+GAP*2,GAP],[GAP,CH+GAP*2],[CW+GAP*2,CH+GAP*2]];
  let done=0;
  shots.forEach((src,i)=>{
    const img=new Image();
    img.onload=function(){
      ctx.drawImage(img,pos[i][0],pos[i][1],CW,CH);
      done++;
      if(done===4){
        ctx.fillStyle='rgba(232,160,32,0.55)';
        ctx.font='bold 38px monospace';ctx.textAlign='center';
        ctx.fillText('TEXAS ROADHOUSE',cv.width/2,cv.height-28);
        showResult(cv.toDataURL('image/jpeg',.92));
      }
    };
    img.src=src;
  });
}
function showResult(url){
  document.getElementById('resultImg').src=url;
  document.getElementById('scBooth').style.display='none';
  document.getElementById('scResult').style.display='flex';
}
function downloadPhoto(){
  const a=document.createElement('a');
  a.download='TxRH-Christmas-'+Date.now()+'.jpg';
  a.href=document.getElementById('resultImg').src;a.click();
}
function openInstagram(){
  downloadPhoto();
  setTimeout(()=>{
    window.location.href='instagram://camera';
    setTimeout(()=>{document.getElementById('igModal').style.display='flex';},1200);
  },600);
}
function closeIgModal(){document.getElementById('igModal').style.display='none';}
function retake(){
  document.getElementById('scResult').style.display='none';
  shotCount=0;shots=[];clearAll();
  updateIndicator();updateFrame();
  document.getElementById('scBooth').style.display='flex';
  makeSnow();startCamera();
}
function goLanding(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  document.getElementById('scBooth').style.display='none';
  document.getElementById('scLanding').style.display='flex';
}
function makeSnow(){
  const c=document.getElementById('snowflakes');c.innerHTML='';
  for(let i=0;i<16;i++){
    const s=document.createElement('div');s.className='sf';
    s.textContent=['*','·','✦','❄'][Math.floor(Math.random()*4)];
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(4+Math.random()*6)+'s';
    s.style.animationDelay=(Math.random()*5)+'s';
    s.style.fontSize=(8+Math.random()*10)+'px';
    c.appendChild(s);
  }
}
