<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0e06">
<title>Texas Roadhouse Christmas Photo Booth</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1a0e06;font-family:Georgia,serif;overflow:hidden}
#app{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a0e06}

#landing{width:100%;height:100vh;background:#1a0e06;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:2rem}
.land-logo{font-size:12px;letter-spacing:4px;color:#C8960C;text-transform:uppercase}
.land-title{font-size:32px;color:#FFD700;text-align:center;line-height:1.4}
.land-sub{font-size:13px;color:#FFB347;letter-spacing:2px}
.land-btn{background:#8B2020;color:#FFD700;border:2px solid #C8960C;padding:16px 40px;font-size:16px;font-family:Georgia,serif;letter-spacing:2px;cursor:pointer;border-radius:4px;margin-top:8px}
.land-btn:hover{background:#a82828}
.land-divider{width:120px;height:1px;background:#C8960C;opacity:0.4}
.land-hint{font-size:11px;color:rgba(200,150,12,0.5);letter-spacing:1px}

#booth{width:100%;height:100vh;display:none;flex-direction:column;align-items:center;background:#1a0e06}

.cam-wrap{position:relative;flex:1;width:100%;max-width:480px;overflow:hidden;background:#000}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#canvas{display:none}

.frame-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.msg-area{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:68%;z-index:10}
#msgInput{width:100%;background:rgba(0,0,0,0.45);border:1px dashed rgba(255,215,0,0.6);border-radius:6px;padding:9px 14px;font-size:14px;color:#FFD700;text-align:center;font-family:Georgia,serif;outline:none;-webkit-appearance:none}
#msgInput::placeholder{color:rgba(255,215,0,0.4)}

.snowflakes{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.sf{position:absolute;color:rgba(255,255,255,0.7);animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0.9}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}

.ctrl-bar{width:100%;max-width:480px;background:#120a04;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.ctrl-btn{background:transparent;border:1px solid rgba(200,150,12,0.5);color:#C8960C;padding:10px 18px;font-size:13px;font-family:Georgia,serif;cursor:pointer;border-radius:4px;letter-spacing:1px}
.ctrl-btn:hover{background:rgba(200,150,12,0.15)}
.shutter-btn{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,0.4);cursor:pointer;flex-shrink:0}
.shutter-btn:active{transform:scale(0.92);background:#e0e0e0}

#result-view{display:none;width:100%;height:100vh;flex-direction:column;align-items:center;background:#1a0e06}
#result-img{flex:1;width:100%;max-width:480px;object-fit:contain}
.result-actions{width:100%;max-width:480px;background:#120a04;padding:16px 20px;display:flex;gap:10px;flex-shrink:0}
.act-btn{flex:1;padding:14px 8px;font-size:14px;font-family:Georgia,serif;letter-spacing:1px;cursor:pointer;border-radius:4px;text-align:center;border:none}
.act-dl{background:#8B2020;color:#FFD700;border:1px solid #C8960C}
.act-share{background:#C8960C;color:#1a0e06}
.act-re{background:transparent;color:#C8960C;border:1px solid rgba(200,150,12,0.5)}
.result-tag{font-size:11px;color:rgba(255,179,71,0.5);letter-spacing:1px;padding:10px;font-family:Georgia,serif;flex-shrink:0}

.no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0705;color:#C8960C;font-size:14px;gap:12px;text-align:center;padding:2rem;z-index:20}
.no-cam-hint{font-size:12px;opacity:0.6;margin-top:4px;line-height:1.6}
</style>
</head>
<body>
<div id="app">

<div id="landing">
  <div class="land-logo">Texas Roadhouse</div>
  <div class="land-divider"></div>
  <div class="land-title">Merry Texas<br>Christmas</div>
  <div class="land-sub">✦ &nbsp; Photo Booth &nbsp; ✦</div>
  <div class="land-divider"></div>
  <button class="land-btn" onclick="startBooth()">카메라 시작하기</button>
  <div class="land-hint">카메라 권한이 필요합니다</div>
</div>

<div id="booth">
  <div class="cam-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="snowflakes" id="snowflakes"></div>

    <svg class="frame-svg" viewBox="0 0 400 711" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <!-- 상단 배너 -->
      <rect x="0" y="0" width="400" height="82" fill="#8B2020" opacity="0.93"/>
      <rect x="0" y="78" width="400" height="5" fill="#C8960C"/>
      <!-- 카우보이 모자 왼쪽 -->
      <g transform="translate(10,6)">
        <ellipse cx="44" cy="52" rx="40" ry="9" fill="#4a2e0a"/>
        <path d="M10 52 Q15 15 44 10 Q73 15 78 52" fill="#6b4015"/>
        <rect x="14" y="40" width="60" height="13" rx="3" fill="#4a2e0a"/>
        <rect x="18" y="43" width="52" height="4" rx="2" fill="#C8960C" opacity="0.7"/>
        <circle cx="64" cy="22" r="5" fill="#8B2020"/>
        <circle cx="55" cy="17" r="5" fill="#8B2020"/>
        <path d="M50 24 Q57 14 66 18" stroke="#2d6a2d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M54 30 Q60 18 70 22" stroke="#2d6a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 카우보이 모자 오른쪽 -->
      <g transform="translate(246,6) scale(-1,1) translate(-154,0)">
        <ellipse cx="44" cy="52" rx="40" ry="9" fill="#4a2e0a"/>
        <path d="M10 52 Q15 15 44 10 Q73 15 78 52" fill="#6b4015"/>
        <rect x="14" y="40" width="60" height="13" rx="3" fill="#4a2e0a"/>
        <rect x="18" y="43" width="52" height="4" rx="2" fill="#C8960C" opacity="0.7"/>
        <circle cx="64" cy="22" r="5" fill="#8B2020"/>
        <circle cx="55" cy="17" r="5" fill="#8B2020"/>
        <path d="M50 24 Q57 14 66 18" stroke="#2d6a2d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M54 30 Q60 18 70 22" stroke="#2d6a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 상단 텍스트 -->
      <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#FFD700" font-family="Georgia,serif" letter-spacing="3">TEXAS ROADHOUSE</text>
      <text x="200" y="62" text-anchor="middle" font-size="12" fill="#FFB347" font-family="Georgia,serif" letter-spacing="2">✦  MERRY CHRISTMAS  ✦</text>
      <!-- 왼쪽 사이드 -->
      <rect x="0" y="83" width="30" height="548" fill="#8B2020" opacity="0.88"/>
      <rect x="30" y="83" width="5" height="548" fill="#C8960C"/>
      <g fill="#C8960C" opacity="0.65">
        <circle cx="15" cy="112" r="5"/><circle cx="15" cy="142" r="5"/><circle cx="15" cy="172" r="5"/>
        <circle cx="15" cy="202" r="5"/><circle cx="15" cy="232" r="5"/><circle cx="15" cy="262" r="5"/>
        <circle cx="15" cy="292" r="5"/><circle cx="15" cy="322" r="5"/><circle cx="15" cy="352" r="5"/>
        <circle cx="15" cy="382" r="5"/><circle cx="15" cy="412" r="5"/><circle cx="15" cy="442" r="5"/>
        <circle cx="15" cy="472" r="5"/><circle cx="15" cy="502" r="5"/><circle cx="15" cy="532" r="5"/>
        <circle cx="15" cy="562" r="5"/><circle cx="15" cy="592" r="5"/>
      </g>
      <!-- 오른쪽 사이드 -->
      <rect x="365" y="83" width="35" height="548" fill="#8B2020" opacity="0.88"/>
      <rect x="365" y="83" width="5" height="548" fill="#C8960C"/>
      <g fill="#C8960C" opacity="0.65">
        <circle cx="385" cy="112" r="5"/><circle cx="385" cy="142" r="5"/><circle cx="385" cy="172" r="5"/>
        <circle cx="385" cy="202" r="5"/><circle cx="385" cy="232" r="5"/><circle cx="385" cy="262" r="5"/>
        <circle cx="385" cy="292" r="5"/><circle cx="385" cy="322" r="5"/><circle cx="385" cy="352" r="5"/>
        <circle cx="385" cy="382" r="5"/><circle cx="385" cy="412" r="5"/><circle cx="385" cy="442" r="5"/>
        <circle cx="385" cy="472" r="5"/><circle cx="385" cy="502" r="5"/><circle cx="385" cy="532" r="5"/>
        <circle cx="385" cy="562" r="5"/><circle cx="385" cy="592" r="5"/>
      </g>
      <!-- 하단 배너 -->
      <rect x="0" y="631" width="400" height="80" fill="#8B2020" opacity="0.93"/>
      <rect x="0" y="631" width="400" height="5" fill="#C8960C"/>
      <!-- 별 장식 -->
      <polygon points="30,647 33,657 44,657 35,663 38,673 30,667 22,673 25,663 16,657 27,657" fill="#FFD700" opacity="0.9"/>
      <polygon points="370,647 373,657 384,657 375,663 378,673 370,667 362,673 365,663 356,657 367,657" fill="#FFD700" opacity="0.9"/>
      <polygon points="200,636 202,643 210,643 204,648 206,655 200,650 194,655 196,648 190,643 198,643" fill="#FFD700" opacity="0.7"/>
      <!-- 메시지 입력창 표시 -->
      <rect x="72" y="648" width="256" height="28" rx="6" fill="rgba(0,0,0,0.3)" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text id="msgDisplay" x="200" y="667" text-anchor="middle" font-size="13" fill="#FFD700" font-family="Georgia,serif" letter-spacing="1"></text>
      <!-- 해시태그 -->
      <text x="200" y="700" text-anchor="middle" font-size="10" fill="#FFB347" font-family="Georgia,serif" letter-spacing="1" opacity="0.75">#TxRH크리스마스 #텍사스로드하우스</text>
    </svg>

    <div class="msg-area">
      <input id="msgInput" type="text" maxlength="20" placeholder="✏  메시지를 입력하세요 (최대 20자)">
    </div>

    <div class="no-cam" id="noCam" style="display:none">
      <div style="font-size:40px;opacity:0.5">📷</div>
      <div>카메라를 사용할 수 없습니다</div>
      <div class="no-cam-hint">브라우저 주소창 옆 카메라 아이콘을 눌러<br>권한을 허용해주세요</div>
    </div>
  </div>

  <div class="ctrl-bar">
    <button class="ctrl-btn" onclick="flipCamera()">🔄 전환</button>
    <button class="shutter-btn" onclick="takePhoto()" aria-label="촬영"></button>
    <button class="ctrl-btn" onclick="resetBooth()">✕ 닫기</button>
  </div>
</div>

<div id="result-view">
  <img id="result-img" alt="촬영된 사진">
  <div class="result-actions">
    <button class="act-btn act-dl" onclick="downloadPhoto()">💾 저장</button>
    <button class="act-btn act-share" onclick="sharePhoto()">📤 공유하기</button>
    <button class="act-btn act-re" onclick="retake()">↩ 다시 찍기</button>
  </div>
  <div class="result-tag">#TxRH크리스마스 &nbsp;•&nbsp; #텍사스로드하우스</div>
</div>

</div>

<script>
let stream = null;
let facing = 'user';

function makeSnow(){
  const c = document.getElementById('snowflakes');
  c.innerHTML = '';
  for(let i = 0; i < 20; i++){
    const s = document.createElement('div');
    s.className = 'sf';
    s.textContent = ['*','·','✦','❄'][Math.floor(Math.random()*4)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (4 + Math.random()*6) + 's';
    s.style.animationDelay = (Math.random()*5) + 's';
    s.style.fontSize = (8 + Math.random()*10) + 'px';
    c.appendChild(s);
  }
}

async function startBooth(){
  document.getElementById('landing').style.display = 'none';
  document.getElementById('booth').style.display = 'flex';
  makeSnow();
  await startCamera();
}

async function startCamera(){
  try {
    if(stream){ stream.getTracks().forEach(t => t.stop()); }
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode: facing, width:{ideal:1080}, height:{ideal:1920} },
      audio: false
    });
    const v = document.getElementById('video');
    v.srcObject = stream;
    document.getElementById('noCam').style.display = 'none';
    v.style.display = 'block';
  } catch(e){
    document.getElementById('noCam').style.display = 'flex';
    document.getElementById('video').style.display = 'none';
  }
}

async function flipCamera(){
  facing = facing === 'user' ? 'environment' : 'user';
  await startCamera();
}

document.getElementById('msgInput').addEventListener('input', function(){
  const t = document.getElementById('msgDisplay');
  if(t) t.textContent = this.value;
});

function takePhoto(){
  const v = document.getElementById('video');
  const wrap = document.getElementById('camWrap');
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;
  const cv = document.getElementById('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');

  ctx.save();
  if(facing === 'user'){ ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0, w, h);
  ctx.restore();

  const svgEl = wrap.querySelector('.frame-svg');
  const svgData = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  const blob = new Blob([svgData], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = function(){
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    finishPhoto(cv.toDataURL('image/jpeg', 0.93));
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    finishPhoto(cv.toDataURL('image/jpeg', 0.93));
  };
  img.src = url;
}

function finishPhoto(dataUrl){
  document.getElementById('result-img').src = dataUrl;
  document.getElementById('booth').style.display = 'none';
  document.getElementById('result-view').style.display = 'flex';
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function downloadPhoto(){
  const a = document.createElement('a');
  a.download = 'TxRH-Christmas-' + Date.now() + '.jpg';
  a.href = document.getElementById('result-img').src;
  a.click();
}

function sharePhoto(){
  const imgSrc = document.getElementById('result-img').src;
  if(navigator.share){
    fetch(imgSrc).then(r => r.blob()).then(blob => {
      const file = new File([blob], 'TxRH-Christmas.jpg', {type:'image/jpeg'});
      navigator.share({
        title: 'Texas Roadhouse Christmas',
        text: '#TxRH크리스마스 #텍사스로드하우스',
        files: [file]
      }).catch(()=>{ downloadPhoto(); });
    });
  } else {
    downloadPhoto();
    alert('사진이 저장되었습니다!\n인스타그램 앱에서 직접 업로드해주세요 📸');
  }
}

function retake(){
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('booth').style.display = 'flex';
  document.getElementById('msgInput').value = '';
  document.getElementById('msgDisplay').textContent = '';
  makeSnow();
  startCamera();
}

function resetBooth(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('booth').style.display = 'none';
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
}
</script>
</body>
</html>
