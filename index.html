<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Texas Roadhouse Photo Booth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@700&display=swap');
:root{ --red:#c0392b; --gold:#e8a020; --dark:#1a0a00; --cream:#fff8ee; }
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; background:var(--dark); overflow:hidden; }
.px{ font-family:'Press Start 2P',monospace; }
.screen{ position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; }

/* ── 랜딩 공통 ── */
#sLanding{ background:var(--dark); overflow-y:auto; padding:12px 0 24px; justify-content:flex-start; }
.l-top { color:var(--gold); font-size:7px; letter-spacing:2px; opacity:.6; margin-top:6px; }
.l-logo{ color:var(--gold); font-size:clamp(14px,4vw,22px); text-align:center; line-height:1.5; text-shadow:3px 3px 0 var(--red); margin:4px 0; }
.l-sub { color:var(--red); font-size:7px; letter-spacing:2px; margin-bottom:14px; }

/* 모드 버튼 */
.mode-row{ display:flex; gap:10px; margin-bottom:16px; }
.mbtn{ color:rgba(255,248,238,.4); background:transparent; border:2px solid rgba(232,160,32,.28); padding:8px 16px; cursor:pointer; font-size:8px; }
.mbtn.on{ color:var(--gold); border-color:var(--gold); background:rgba(232,160,32,.1); }

/* ── STEP 1: 테마 선택 ── */
#stepTheme{ width:100%; max-width:400px; padding:0 12px; }
.step-title{ color:rgba(232,160,32,.6); font-size:7px; letter-spacing:1px; margin-bottom:10px; text-align:center; }
.theme-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.tc{
  position:relative; border:2px solid rgba(232,160,32,.28); cursor:pointer;
  overflow:hidden; background:#0e0500; border-radius:4px; padding-bottom:8px;
}
.tc.on{ border-color:var(--gold); }
.tc .tg{ display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; }
.tc .tg img{ width:100%; aspect-ratio:1; object-fit:cover; }
.tc .lbl{ font-size:5px; color:var(--gold); text-align:center; padding:3px 2px; line-height:1.4; }
.tc .chk{ position:absolute; top:3px; right:3px; width:14px; height:14px; background:var(--gold); display:none; align-items:center; justify-content:center; font-size:9px; color:#000; }
.tc.on .chk{ display:flex; }

/* ── STEP 2: 세부 프레임 선택 (1컷만) ── */
#stepFrame{ display:none; width:100%; max-width:400px; padding:0 12px; }
.back-btn{ color:rgba(232,160,32,.6); font-size:6px; cursor:pointer; margin-bottom:10px; display:flex; align-items:center; gap:6px; background:none; border:none; }
.frame-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.fc{ position:relative; border:2px solid rgba(232,160,32,.28); cursor:pointer; overflow:hidden; background:#0e0500; border-radius:3px; }
.fc.on{ border-color:var(--gold); }
.fc img{ width:100%; display:block; object-fit:cover; aspect-ratio:1; }
.fc .lbl{ position:absolute; bottom:0; left:0; right:0; background:rgba(26,10,0,.85); font-size:5px; color:var(--gold); padding:3px; text-align:center; }
.fc .chk{ position:absolute; top:3px; right:3px; width:14px; height:14px; background:var(--gold); display:none; align-items:center; justify-content:center; font-size:9px; color:#000; }
.fc.on .chk{ display:flex; }

.start-btn{ background:var(--red); color:#fff; border:none; border-bottom:4px solid #8b1a1a; padding:12px 28px; font-size:9px; cursor:pointer; margin-top:4px; }

/* ── 부스 ── */
#sBooth{ background:#080300; display:none; }
.topbar{ width:100%; max-width:520px; background:#110600; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; border-bottom:1px solid rgba(232,160,32,.15); }
.ttl{ color:var(--gold); font-size:7px; }
.dots{ display:flex; gap:6px; }
.dot{ width:10px; height:10px; background:rgba(255,255,255,.1); border:1px solid rgba(232,160,32,.2); }
.dot.done{ background:var(--gold); }
.dot.cur{ background:var(--red); animation:blink .6s infinite; }
@keyframes blink{ 0%,100%{opacity:1}50%{opacity:.3} }
.vp{ position:relative; flex:1; width:100%; max-width:520px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0; }
#fbox{ position:relative; flex-shrink:0; overflow:hidden; }
#vid{ position:absolute; object-fit:cover; background:#000; transform-origin:center center; z-index:1; }
#canvas{ display:none; }
.sl{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
.si{ position:absolute; pointer-events:auto; touch-action:none; user-select:none; transform-origin:center; }
#fimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; z-index:3; pointer-events:none; }
.zbar{ width:100%; max-width:520px; background:#110600; padding:5px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; }
.zbar input{ flex:1; accent-color:var(--gold); cursor:pointer; }
.zbar span{ color:var(--gold); font-size:7px; width:32px; text-align:right; }
.tbar{ width:100%; max-width:520px; background:#0e0500; padding:5px 8px; display:flex; gap:5px; overflow-x:auto; flex-shrink:0; scrollbar-width:none; align-items:center; }
.tbar::-webkit-scrollbar{ display:none; }
.to{ font-size:20px; cursor:pointer; padding:3px 4px; line-height:1; border:1px solid transparent; }
.to:hover{ background:rgba(232,160,32,.12); border-color:rgba(232,160,32,.28); }
.tsep{ width:1px; height:18px; background:rgba(232,160,32,.15); flex-shrink:0; margin:0 2px; }
.tlbl{ color:rgba(232,160,32,.4); font-size:5px; flex-shrink:0; white-space:nowrap; }
.tbtn{ color:var(--gold); background:rgba(232,160,32,.08); border:1px solid rgba(232,160,32,.25); padding:4px 7px; cursor:pointer; font-size:5px; flex-shrink:0; white-space:nowrap; }
.cbar{ width:100%; max-width:520px; background:#110600; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0; }
.cbtn{ color:var(--gold); background:transparent; border:2px solid rgba(232,160,32,.3); padding:8px 12px; cursor:pointer; font-size:7px; }
.shutter{ width:56px; height:56px; border-radius:50%; background:var(--cream); border:4px solid rgba(255,255,255,.28); cursor:pointer; flex-shrink:0; box-shadow:0 0 0 2px var(--gold); }
.shutter:active{ transform:scale(.9); }

/* ── 결과 ── */
#sResult{ background:var(--dark); display:none; }
#rimg{ width:100%; max-width:520px; flex:1; object-fit:contain; display:block; min-height:0; }
.rbar{ width:100%; max-width:520px; background:#110600; padding:12px 14px; display:flex; gap:8px; flex-shrink:0; border-top:2px solid rgba(232,160,32,.2); }
.rbtn{ flex:1; padding:10px 4px; font-size:6px; cursor:pointer; border:none; text-align:center; }
.rb-save { background:var(--red);  color:#fff;        border-bottom:3px solid #8b1a1a; }
.rb-insta{ background:var(--gold); color:var(--dark);  border-bottom:3px solid #b06010; }
.rb-retry{ background:transparent; color:var(--gold);  border:2px solid rgba(232,160,32,.4); }
.rtag{ color:rgba(232,160,32,.3); font-size:6px; text-align:center; padding:6px; flex-shrink:0; }

/* ── 모달 ── */
.modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:60; align-items:center; justify-content:center; padding:1.5rem; }
.mbox{ background:#1a0a00; border:2px solid var(--gold); padding:1.25rem; width:100%; max-width:300px; }
.mtitle{ color:var(--gold); font-size:8px; margin-bottom:12px; }
.mbox input{ width:100%; background:rgba(255,248,238,.06); border:1px solid rgba(232,160,32,.3); color:var(--cream); padding:8px 10px; font-family:'Noto Sans KR',sans-serif; font-size:13px; outline:none; margin-bottom:10px; }
.mrow{ display:flex; gap:8px; margin-top:10px; }
.ig-step{ font-family:'Noto Sans KR',sans-serif; font-size:12px; color:rgba(255,220,150,.8); line-height:2.2; }
.ig-step b{ color:var(--gold); }
.copy-tag{ background:rgba(232,160,32,.1); border:1px solid rgba(232,160,32,.3); color:var(--gold); font-family:'Noto Sans KR',sans-serif; font-size:11px; padding:6px 10px; margin-bottom:8px; border-radius:3px; word-break:break-all; }
.copy-btn{ width:100%; background:rgba(232,160,32,.15); border:1px solid rgba(232,160,32,.4); color:var(--gold); font-size:6px; padding:7px; cursor:pointer; margin-bottom:12px; text-align:center; }
</style>
</head>
<body>

<!-- ══ 랜딩 ══ -->
<div id="sLanding" class="screen px">
  <div class="l-top">★ PHOTO BOOTH ★</div>
  <div class="l-logo px">TEXAS<br>ROADHOUSE</div>
  <div class="l-sub px">CHRISTMAS 2024</div>

  <!-- 1컷/4컷 모드 선택 -->
  <div class="mode-row">
    <button class="mbtn px on" id="m1" onclick="setMode(1)">1컷</button>
    <button class="mbtn px"    id="m4" onclick="setMode(4)">4컷</button>
  </div>

  <!-- STEP 1: 테마 선택 (1컷/4컷 공통) -->
  <div id="stepTheme">
    <div class="step-title px">테마를 선택하세요</div>
    <div class="theme-grid">
      <div class="tc on" id="tc0" onclick="pickTheme(0)">
        <div class="tg">
          <img src="frames/thumbs/appetizer_roll.jpg" loading="lazy">
          <img src="frames/thumbs/appetizer_peanut.jpg" loading="lazy">
          <img src="frames/thumbs/appetizer_steak.jpg" loading="lazy">
          <img src="frames/thumbs/appetizer_potato.jpg" loading="lazy">
        </div>
        <div class="lbl px">🍞 APPETIZER</div>
        <div class="chk">✓</div>
      </div>
      <div class="tc" id="tc1" onclick="pickTheme(1)">
        <div class="tg">
          <img src="frames/thumbs/xmas_rope.jpg" loading="lazy">
          <img src="frames/thumbs/xmas_merry.jpg" loading="lazy">
          <img src="frames/thumbs/xmas_longhorn.jpg" loading="lazy">
          <img src="frames/thumbs/xmas_truck.jpg" loading="lazy">
        </div>
        <div class="lbl px">🤠 TX XMAS</div>
        <div class="chk">✓</div>
      </div>
      <div class="tc" id="tc2" onclick="pickTheme(2)">
        <div class="tg">
          <img src="frames/thumbs/andy_santa.jpg" loading="lazy">
          <img src="frames/thumbs/andy_texas.jpg" loading="lazy">
          <img src="frames/thumbs/andy_star.jpg" loading="lazy">
          <img src="frames/thumbs/andy_cozy.jpg" loading="lazy">
        </div>
        <div class="lbl px">🦔 ANDY</div>
        <div class="chk">✓</div>
      </div>
    </div>
    <!-- 1컷: 다음 버튼 → 세부 선택으로 -->
    <button class="start-btn px" id="btnNext" onclick="goFramePick()" style="width:100%;max-width:400px">다음 ▶</button>
    <!-- 4컷: 바로 시작 -->
    <button class="start-btn px" id="btnStart4" onclick="startBooth4()" style="width:100%;max-width:400px;display:none">START ▶</button>
  </div>

  <!-- STEP 2: 세부 프레임 선택 (1컷만) -->
  <div id="stepFrame">
    <button class="back-btn px" onclick="goThemePick()">◀ 뒤로</button>
    <div class="step-title px" id="frameStepTitle">프레임을 선택하세요</div>
    <div class="frame-grid" id="frameGrid"></div>
    <button class="start-btn px" onclick="startBooth1()" style="width:100%;max-width:400px">START ▶</button>
  </div>
</div>

<!-- ══ 부스 ══ -->
<div id="sBooth" class="screen px">
  <div class="topbar">
    <span class="ttl px" id="bTitle">PHOTO BOOTH</span>
    <div class="dots" id="bDots"></div>
  </div>
  <div class="vp" id="vp">
    <div id="fbox">
      <video id="vid" autoplay playsinline muted></video>
      <div class="sl" id="sl"></div>
      <img id="fimg" src="" alt="">
    </div>
  </div>
  <div class="zbar">
    <span style="font-size:11px">🔍</span>
    <input type="range" min="0.5" max="4" step="0.1" value="1" oninput="setZoom(parseFloat(this.value))">
    <span id="zLabel" class="px">1.0x</span>
  </div>
  <div class="tbar">
    <span class="tlbl px">스티커</span>
    <span class="to" onclick="addSticker('🤠')">🤠</span>
    <span class="to" onclick="addSticker('🎄')">🎄</span>
    <span class="to" onclick="addSticker('⭐')">⭐</span>
    <span class="to" onclick="addSticker('❄️')">❄️</span>
    <span class="to" onclick="addSticker('🎅')">🎅</span>
    <span class="to" onclick="addSticker('🥩')">🥩</span>
    <span class="to" onclick="addSticker('🍞')">🍞</span>
    <span class="to" onclick="addSticker('🥔')">🥔</span>
    <span class="to" onclick="addSticker('🥜')">🥜</span>
    <div class="tsep"></div>
    <span class="tlbl px">문구</span>
    <button class="tbtn px" onclick="openBubble()">💬 말풍선</button>
    <div class="tsep"></div>
    <button class="tbtn px" onclick="clearStickers()" style="color:rgba(255,80,80,.7)">🗑</button>
  </div>
  <div class="cbar">
    <button class="cbtn px" onclick="flipCam()">🔄</button>
    <button class="shutter" id="shutter" onclick="shoot()"></button>
    <button class="cbtn px" onclick="goLanding()">✕</button>
  </div>
</div>

<!-- ══ 결과 ══ -->
<div id="sResult" class="screen px">
  <img id="rimg" alt="">
  <div class="rbar">
    <button class="rbtn rb-save px"  onclick="dlPhoto()">💾 저장</button>
    <button class="rbtn rb-insta px" onclick="toInsta()">📸 인스타</button>
    <button class="rbtn rb-retry px" onclick="retry()">↩ 다시</button>
  </div>
  <div class="rtag px">#TxRH크리스마스 #텍사스로드하우스</div>
</div>

<!-- 말풍선 모달 -->
<div id="mBubble" class="modal">
  <div class="mbox">
    <div class="mtitle px">💬 말풍선 추가</div>
    <input id="bInput" type="text" maxlength="20" placeholder="텍스트 입력 (최대 20자)">
    <div class="mrow">
      <button class="rbtn rb-insta px" onclick="addBubble()" style="flex:1">추가</button>
      <button class="rbtn rb-retry px" onclick="closeBubble()" style="flex:1">취소</button>
    </div>
  </div>
</div>

<!-- 인스타 공유 모달 -->
<div id="mInsta" class="modal">
  <div class="mbox">
    <div class="mtitle px">📸 인스타 공유</div>
    <div class="ig-step">
      1. 사진이 자동 <b>저장</b>됩니다<br>
      2. 아래 태그를 <b>복사</b>하세요<br>
      3. 인스타그램에 <b>업로드</b>
    </div>
    <div class="copy-tag" id="copyTagBox">#texasroadhouse #텍사스로드하우스 @texasroadhouse_kr #TxRH크리스마스</div>
    <button class="copy-btn px" onclick="copyTag()" id="copyBtn">📋 태그 복사하기</button>
    <div class="mrow">
      <button class="rbtn rb-insta px" onclick="openInstaApp()" style="flex:1">인스타 열기</button>
      <button class="rbtn rb-retry px" onclick="closeInsta()" style="flex:1">닫기</button>
    </div>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
// ══════════════════════════════
// 프레임 데이터
// ══════════════════════════════
var FRAMES = [
  {id:0,  src:'frames/appetizer_roll.png',   label:'DINNER ROLL',  aspect:1.0,    hx:0.2105,hy:0.2137,hw:0.6172,hh:0.5853},
  {id:1,  src:'frames/appetizer_peanut.png', label:'PEANUT',       aspect:1.0,    hx:0.2313,hy:0.1978,hw:0.5758,hh:0.5550},
  {id:2,  src:'frames/appetizer_steak.png',  label:'RIBEYE',       aspect:1.0,    hx:0.1738,hy:0.1994,hw:0.5853,hh:0.4833},
  {id:3,  src:'frames/appetizer_potato.png', label:'POTATO',       aspect:1.0,    hx:0.1722,hy:0.2632,hw:0.6077,hh:0.4833},
  {id:4,  src:'frames/xmas_rope.png',        label:'TX ROPE',      aspect:1.0,    hx:0.2233,hy:0.2632,hw:0.6316,hh:0.5805},
  {id:5,  src:'frames/xmas_merry.png',       label:'MERRY TX',     aspect:1.3887, hx:0.2366,hy:0.3445,hw:0.5229,hh:0.5212},
  {id:6,  src:'frames/xmas_longhorn.png',    label:'LONGHORN',     aspect:0.8324, hx:0.2451,hy:0.2041,hw:0.5065,hh:0.6081},
  {id:7,  src:'frames/xmas_truck.png',       label:'TX TRUCK',     aspect:1.4943, hx:0.1141,hy:0.1609,hw:0.7500,hh:0.6686},
  {id:8,  src:'frames/andy_santa.png',       label:'ANDY SANTA',   aspect:1.0,    hx:0.3684,hy:0.1571,hw:0.5247,hh:0.6938},
  {id:9,  src:'frames/andy_texas.png',       label:'ANDY TEXAS',   aspect:0.9661, hx:0.2360,hy:0.2219,hw:0.6396,hh:0.6487},
  {id:10, src:'frames/andy_star.png',        label:'ANDY STAR',    aspect:0.9661, hx:0.1515,hy:0.1048,hw:0.7049,hh:0.6641},
  {id:11, src:'frames/andy_cozy.png',        label:'ANDY COZY',    aspect:1.1901, hx:0.1611,hy:0.1769,hw:0.6944,hh:0.6099}
];

// 테마별 프레임 ID 묶음
var THEMES = [
  { name:'🍞 APPETIZER', ids:[0,1,2,3] },
  { name:'🤠 TX XMAS',   ids:[4,5,6,7] },
  { name:'🦔 ANDY',      ids:[8,9,10,11] }
];

// 썸네일 파일명 (thumbs 폴더)
var THUMBS = [
  'appetizer_roll','appetizer_peanut','appetizer_steak','appetizer_potato',
  'xmas_rope','xmas_merry','xmas_longhorn','xmas_truck',
  'andy_santa','andy_texas','andy_star','andy_cozy'
];

// ── 앱 상태 ──
var mode      = 1;      // 1 or 4
var selTheme  = 0;      // 선택된 테마 인덱스
var sel1      = 0;      // 1컷: 선택된 프레임 ID
var stream    = null;
var facing    = 'user';
var zoom      = 1;
var shooting  = false;
var fids      = [];     // 현재 세션 프레임 ID 목록
var shotIdx   = 0;
var shots     = [];
var gTarget   = null;

// ══════════════════════════════
// 랜딩: 모드 전환
// ══════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('m1').classList.toggle('on', m===1);
  document.getElementById('m4').classList.toggle('on', m===4);
  // 4컷은 START 직접, 1컷은 다음(세부선택)으로
  document.getElementById('btnNext').style.display   = m===1 ? 'block' : 'none';
  document.getElementById('btnStart4').style.display = m===4 ? 'block' : 'none';
}

// ══════════════════════════════
// STEP 1: 테마 선택
// ══════════════════════════════
function pickTheme(idx) {
  selTheme = idx;
  document.querySelectorAll('.tc').forEach(function(c){ c.classList.remove('on'); });
  document.getElementById('tc'+idx).classList.add('on');
}

// 1컷: 다음 → 세부 프레임 선택 화면
function goFramePick() {
  // 선택된 테마의 프레임 카드 동적 생성
  var theme = THEMES[selTheme];
  document.getElementById('frameStepTitle').textContent = theme.name + ' 프레임 선택';
  var grid = document.getElementById('frameGrid');
  grid.innerHTML = '';
  theme.ids.forEach(function(fid, i) {
    var f    = FRAMES[fid];
    var thumb= THUMBS[fid];
    var div  = document.createElement('div');
    div.className = 'fc' + (i===0?' on':'');
    div.id        = 'ff'+fid;
    div.onclick   = function(){ pickFrame(fid); };
    div.innerHTML =
      '<img src="frames/thumbs/'+thumb+'.jpg" loading="lazy">' +
      '<div class="lbl px">'+f.label+'</div>' +
      '<div class="chk">✓</div>';
    grid.appendChild(div);
  });
  // 첫 번째 프레임 기본 선택
  sel1 = theme.ids[0];

  document.getElementById('stepTheme').style.display = 'none';
  document.getElementById('stepFrame').style.display  = 'block';
}

// 뒤로: 테마 선택으로
function goThemePick() {
  document.getElementById('stepFrame').style.display  = 'none';
  document.getElementById('stepTheme').style.display  = 'block';
}

// 세부 프레임 선택
function pickFrame(fid) {
  sel1 = fid;
  document.querySelectorAll('#frameGrid .fc').forEach(function(c){ c.classList.remove('on'); });
  var el = document.getElementById('ff'+fid);

// ══════════════════════════════
// 부스 시작
// ══════════════════════════════
function startBooth1() {
  // 1컷: 선택된 프레임 하나
  fids = [sel1];
  _startBooth();
}

function startBooth4() {
  // 4컷: 선택된 테마의 4개 프레임
  fids = THEMES[selTheme].ids.slice();
  _startBooth();
}

function _startBooth() {
  shotIdx  = 0; shots = []; shooting = false;
  document.getElementById('sLanding').style.display = 'none';
  document.getElementById('sBooth').style.display   = 'flex';
  // stepFrame 초기화 (다음에 랜딩 돌아올 때를 위해)
  document.getElementById('stepFrame').style.display = 'none';
  document.getElementById('stepTheme').style.display = 'block';
  document.getElementById('bTitle').textContent = FRAMES[fids[0]].label;
  updateDots();
  loadFimg(fids[0]);
  startCam();
}

function updateDots() {
  var el = document.getElementById('bDots');
  if(fids.length === 1){ el.innerHTML=''; return; }
  el.innerHTML = fids.map(function(_,i){
    var c='dot'+(i<shotIdx?' done':i===shotIdx?' cur':'');
    return '<div class="'+c+'"></div>';
  }).join('');
}

// ══════════════════════════════
// 카메라
// ══════════════════════════════
function startCam() {
  if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing }, audio:false })
  .then(function(s){
    stream = s;
    document.getElementById('vid').srcObject = s;
    applyLayout(fids[Math.min(shotIdx,fids.length-1)]);
  })
  .catch(function(e){ alert('카메라 오류: '+e.message); });
}

function flipCam() {
  facing = facing==='user' ? 'environment' : 'user';
  startCam();
}

// ══════════════════════════════
// 레이아웃: fbox 크기 + video 위치
// ══════════════════════════════
function applyLayout(fid) {
  var f   = FRAMES[fid];
  var vp  = document.getElementById('vp');
  var vpW = vp.offsetWidth, vpH = vp.offsetHeight;
  var cW, cH;
  if(vpW/vpH > f.aspect){ cH=vpH; cW=cH*f.aspect; }
  else                   { cW=vpW; cH=cW/f.aspect; }
  var fb = document.getElementById('fbox');
  fb.style.width  = cW+'px';
  fb.style.height = cH+'px';
  var v = document.getElementById('vid');
  v.style.left   = (f.hx*cW)+'px';
  v.style.top    = (f.hy*cH)+'px';
  v.style.width  = (f.hw*cW)+'px';
  v.style.height = (f.hh*cH)+'px';
  applyTransform();
}

window.addEventListener('resize', function(){
  if(fids.length) applyLayout(fids[Math.min(shotIdx,fids.length-1)]);
});

function setZoom(z) {
  zoom = Math.max(0.5, Math.min(4,z));
  applyTransform();
  document.getElementById('zLabel').textContent = zoom.toFixed(1)+'x';
}

function applyTransform() {
  var v = document.getElementById('vid');
  v.style.transform = (facing==='user'?'scaleX(-1)':'scaleX(1)') + ' scale('+zoom+')';
}

// 핀치 줌
var _vp=document.getElementById('vp'), _pd=0, _pz=1;
_vp.addEventListener('touchstart',function(e){
  if(e.touches.length===2&&!gTarget){
    var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    _pd=Math.hypot(dx,dy); _pz=zoom;
  }
},{passive:true});
_vp.addEventListener('touchmove',function(e){
  if(e.touches.length===2&&!gTarget){
    e.preventDefault();
    var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    setZoom(_pz*(Math.hypot(dx,dy)/_pd));
  }
},{passive:false});

// ══════════════════════════════
// 프레임 PNG 로드
// ══════════════════════════════
function loadFimg(fid) {
  var img = document.getElementById('fimg');
  img.onload = function(){ applyLayout(fid); };
  img.src    = FRAMES[fid].src;
}

// ══════════════════════════════
// 촬영
// ══════════════════════════════
function shoot() {
  if(shooting) return;
  shooting = true;
  document.getElementById('shutter').style.opacity = '0.5';

  var fid = fids[shotIdx];
  var f   = FRAMES[fid];
  var v   = document.getElementById('vid');
  var fb  = document.getElementById('fbox');
  var LONG = 2000;
  var CW = f.aspect>=1 ? LONG : Math.round(LONG*f.aspect);
  var CH = f.aspect>=1 ? Math.round(LONG/f.aspect) : LONG;
  var cv = document.getElementById('canvas');
  cv.width=CW; cv.height=CH;
  var ctx = cv.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);

  // 카메라 → 구멍에 그리기
  var hX=f.hx*CW, hY=f.hy*CH, hW=f.hw*CW, hH=f.hh*CH;
  var vw=v.videoWidth||hW, vh=v.videoHeight||hH;
  var sc=Math.max(hW/vw,hH/vh)*zoom;
  var dw=vw*sc, dh=vh*sc;
  ctx.save();
  ctx.beginPath(); ctx.rect(hX,hY,hW,hH); ctx.clip();
  if(facing==='user'){ ctx.translate(hX*2+hW,0); ctx.scale(-1,1); }
  ctx.drawImage(v, hX+(hW-dw)/2, hY+(hH-dh)/2, dw, dh);
  ctx.restore();

  // 스티커
  var fbW=fb.offsetWidth||1, fbH=fb.offsetHeight||1;
  document.getElementById('sl').querySelectorAll('.si').forEach(function(s){
    var ex=parseFloat(s.dataset.x||0)*(CW/fbW), ey=parseFloat(s.dataset.y||0)*(CH/fbH);
    var sc2=parseFloat(s.dataset.s||1), rot=parseFloat(s.dataset.r||0)*Math.PI/180;
    ctx.save(); ctx.translate(ex,ey); ctx.rotate(rot); ctx.scale(sc2*(CW/fbW),sc2*(CH/fbH));
    var sp=s.querySelector('span');
    if(sp){ ctx.font='34px serif'; ctx.fillText(sp.textContent,0,34); }
    else {
      var d=s.querySelector('div');
      if(d){
        var t=(d.firstChild&&d.firstChild.nodeValue)?d.firstChild.nodeValue.trim():d.textContent.trim();
        ctx.font='bold 14px sans-serif';
        var tw=ctx.measureText(t).width;
        ctx.fillStyle='rgba(255,248,238,.94)'; ctx.fillRect(0,0,tw+24,30);
        ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5; ctx.strokeRect(0,0,tw+24,30);
        ctx.fillStyle='#1a0a00'; ctx.fillText(t,12,19);
        ctx.fillStyle='#c0392b';
        ctx.beginPath(); ctx.moveTo(16,30); ctx.lineTo(8,41); ctx.lineTo(32,30); ctx.fill();
      }
    }
    ctx.restore();
  });

  function finish(){
    shooting=false;
    document.getElementById('shutter').style.opacity='1';
    var url; try{ url=cv.toDataURL('image/jpeg',0.92); }catch(e){ url=''; }
    shots.push(url); shotIdx++;
    if(fids.length===4&&shotIdx<4){
      clearStickers(); updateDots();
      loadFimg(fids[shotIdx]); applyLayout(fids[shotIdx]);
      document.getElementById('bTitle').textContent=FRAMES[fids[shotIdx]].label;
      flash();
    } else {
      if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
      if(fids.length===4) build4(); else showResult(url);
    }
  }

  var fi=document.getElementById('fimg');
  if(fi.naturalWidth>0){ try{ctx.drawImage(fi,0,0,CW,CH);}catch(e){} finish(); }
  else if(fi.src){ fi.onload=function(){try{ctx.drawImage(fi,0,0,CW,CH);}catch(e){}finish();}; fi.onerror=finish; }
  else{ finish(); }
}

function flash(){
  var fb=document.getElementById('fbox');
  var fl=document.createElement('div');
  fl.style.cssText='position:absolute;inset:0;background:#fff;z-index:20;pointer-events:none;transition:opacity .2s';
  fb.appendChild(fl);
  setTimeout(function(){fl.style.opacity='0';setTimeout(function(){fl.remove();},200);},30);
}

// ══════════════════════════════
// 4컷 합성: 프레임 비율에 따라 레이아웃 최적화
// - 모두 세로형(aspect<=1): 2x2 그리드
// - 가로형 포함: 각 프레임 원본 비율 유지한 세로 스트립
// ══════════════════════════════
function build4() {
  var GAP = 16;
  var BASE = 1080; // 각 컷의 기준 폭

  // 각 컷의 실제 크기 계산
  var sizes = fids.map(function(fid){
    var f = FRAMES[fid];
    return { w: BASE, h: Math.round(BASE/f.aspect) };
  });

  // 모두 세로형(aspect<=1.1)이면 2x2, 아니면 세로 스트립
  var allPortrait = fids.every(function(fid){ return FRAMES[fid].aspect <= 1.1; });

  var cv  = document.getElementById('canvas');
  var ctx;

  if(allPortrait) {
    // 2x2 그리드
    var cw = sizes[0].w, ch = sizes[0].h;
    cv.width  = cw*2 + GAP*3;
    cv.height = ch*2 + GAP*3;
    ctx = cv.getContext('2d');
    ctx.fillStyle='#1a0a00'; ctx.fillRect(0,0,cv.width,cv.height);
    var pos = [[GAP,GAP],[cw+GAP*2,GAP],[GAP,ch+GAP*2],[cw+GAP*2,ch+GAP*2]];
    var done=0;
    shots.forEach(function(src,i){
      var img=new Image();
      img.onload=function(){
        ctx.drawImage(img,pos[i][0],pos[i][1],cw,ch);
        done++;
        if(done===4) finalizeGrid(cv,ctx);
      };
      img.src=src;
    });
  } else {
    // 세로 스트립: 각 프레임 원본 비율 유지, 폭 통일, 세로로 나열
    var stripW = BASE;
    var totalH = GAP;
    sizes.forEach(function(s){ totalH += s.h + GAP; });
    cv.width  = stripW;
    cv.height = totalH;
    ctx = cv.getContext('2d');
    ctx.fillStyle='#1a0a00'; ctx.fillRect(0,0,cv.width,cv.height);
    var y = GAP, done=0;
    shots.forEach(function(src,i){
      var img=new Image();
      var captureY=y, captureH=sizes[i].h;
      img.onload=function(){
        ctx.drawImage(img,GAP,captureY,stripW-GAP*2,captureH);
        done++;
        if(done===4) finalizeGrid(cv,ctx);
      };
      img.src=src;
      y += sizes[i].h + GAP;
    });
  }
}

function finalizeGrid(cv,ctx){
  ctx.fillStyle='rgba(232,160,32,.5)';
  ctx.font='bold 28px monospace';
  ctx.textAlign='center';
  ctx.fillText('TEXAS ROADHOUSE', cv.width/2, cv.height-16);
  showResult(cv.toDataURL('image/jpeg',0.92));
}

function showResult(url){
  document.getElementById('rimg').src=url;
  document.getElementById('sBooth').style.display='none';
  document.getElementById('sResult').style.display='flex';
}

// ══════════════════════════════
// 결과 화면
// ══════════════════════════════

// 인스타 공유: 저장 → 태그 복사 안내 → 앱 이동
function toInsta(){
  // 1) 사진 저장
  dlPhoto();
  // 2) 모달 표시
  document.getElementById('mInsta').style.display='flex';

function copyTag(){
  var tag='#texasroadhouse #텍사스로드하우스 @texasroadhouse_kr #TxRH크리스마스';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tag).then(function(){
      document.getElementById('copyBtn').textContent='✅ 복사됐어요!';
      setTimeout(function(){ document.getElementById('copyBtn').textContent='📋 태그 복사하기'; },2000);
    });
  } else {
    // fallback
    var ta=document.createElement('textarea');
    ta.value=tag; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy');
      document.getElementById('copyBtn').textContent='✅ 복사됐어요!';
      setTimeout(function(){ document.getElementById('copyBtn').textContent='📋 태그 복사하기'; },2000);
    }catch(e){}
    document.body.removeChild(ta);
  }
}

function openInstaApp(){
  var ua=navigator.userAgent.toLowerCase();
  if(/iphone|ipad/.test(ua))      window.location.href='instagram://app';
  else if(/android/.test(ua))     window.location.href='intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end';
  else                             window.open('https://www.instagram.com/','_blank');
  closeInsta();
}

function closeInsta(){ document.getElementById('mInsta').style.display='none'; }

function retry(){
  shotIdx=0; shots=[]; shooting=false;
  document.getElementById('shutter').style.opacity='1';
  clearStickers(); updateDots();
  loadFimg(fids[0]); applyLayout(fids[0]);

// ══════════════════════════════
// 스티커 시스템
// ══════════════════════════════
function addSticker(emoji){
  var sl=document.getElementById('sl'), fb=document.getElementById('fbox');
  var el=document.createElement('div');
  el.className='si';
  el.innerHTML='<span style="font-size:34px;line-height:1;display:block">'+emoji+'</span>';
  el.dataset.x=fb.offsetWidth/2-17; el.dataset.y=fb.offsetHeight/2-17;
  el.dataset.s=1; el.dataset.r=0;
  applyT(el); bindGesture(el); sl.appendChild(el);
}

function openBubble(){ document.getElementById('mBubble').style.display='flex'; setTimeout(function(){document.getElementById('bInput').focus();},80); }
function closeBubble(){ document.getElementById('mBubble').style.display='none'; document.getElementById('bInput').value=''; }

function addBubble(){
  var txt=document.getElementById('bInput').value.trim(); if(!txt) return;
  var sl=document.getElementById('sl'), fb=document.getElementById('fbox');
  var el=document.createElement('div');
  el.className='si';
  el.dataset.x=fb.offsetWidth/2-60; el.dataset.y=fb.offsetHeight/2-24;
  el.dataset.s=1; el.dataset.r=0;
  el.innerHTML='<div style="position:relative;background:rgba(255,248,238,.94);border:2.5px solid #c0392b;border-radius:8px;padding:6px 11px;max-width:160px;font-family:Noto Sans KR,sans-serif;font-size:13px;color:#1a0a00;font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 #8b1a1a">'+txt+'<div style="position:absolute;bottom:-11px;left:16px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #c0392b"></div></div>';
  applyT(el); bindGesture(el); sl.appendChild(el); closeBubble();
}

function applyT(el){
  el.style.left=parseFloat(el.dataset.x)+'px';
  el.style.top=parseFloat(el.dataset.y)+'px';
  el.style.transform='rotate('+el.dataset.r+'deg) scale('+el.dataset.s+')';
}

function bindGesture(el){
  var fb=document.getElementById('fbox');
  var ss={x:0,y:0,ex:0,ey:0}, ps={d:0,a:0,s:1,r:0}, tap=0;
  el.addEventListener('touchstart',function(e){
    e.stopPropagation();
    if(e.touches.length===1){
      e.preventDefault(); gTarget=el;
      ss={x:e.touches[0].clientX,y:e.touches[0].clientY,ex:parseFloat(el.dataset.x),ey:parseFloat(el.dataset.y)};
    } else if(e.touches.length===2){
      e.preventDefault(); gTarget=el;
      var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      ps={d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)*180/Math.PI,s:parseFloat(el.dataset.s)||1,r:parseFloat(el.dataset.r)||0};
    }
  },{passive:false});
  el.addEventListener('touchmove',function(e){
    e.stopPropagation(); e.preventDefault();
    var wr=fb.getBoundingClientRect();
    if(e.touches.length===1&&gTarget===el){
      el.dataset.x=Math.max(-30,Math.min(wr.width-10,ss.ex+(e.touches[0].clientX-ss.x)));
      el.dataset.y=Math.max(-30,Math.min(wr.height-10,ss.ey+(e.touches[0].clientY-ss.y)));
    } else if(e.touches.length===2&&gTarget===el){
      var dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      el.dataset.s=Math.max(0.2,Math.min(5,ps.s*(Math.hypot(dx,dy)/ps.d)));
      el.dataset.r=ps.r+(Math.atan2(dy,dx)*180/Math.PI-ps.a);
    }
    applyT(el);
  },{passive:false});
  el.addEventListener('touchend',function(e){
    e.stopPropagation();
    if(e.touches.length===0){ var now=Date.now(); if(now-tap<300) el.remove(); tap=now; gTarget=null; }
  });
  var md=false, ms={x:0,y:0,ex:0,ey:0};
  el.addEventListener('mousedown',function(e){ e.stopPropagation(); md=true; gTarget=el; ms={x:e.clientX,y:e.clientY,ex:parseFloat(el.dataset.x),ey:parseFloat(el.dataset.y)}; });
  document.addEventListener('mousemove',function(e){
    if(!md||gTarget!==el) return;
    var wr=fb.getBoundingClientRect();
    el.dataset.x=Math.max(-30,Math.min(wr.width-10,ms.ex+(e.clientX-ms.x)));
    el.dataset.y=Math.max(-30,Math.min(wr.height-10,ms.ey+(e.clientY-ms.y)));
    applyT(el);
  });
  document.addEventListener('mouseup',function(){ md=false; gTarget=null; });
  el.addEventListener('dblclick',function(){ el.remove(); });
}

function clearStickers(){ document.getElementById('sl').innerHTML=''; }
</script>
